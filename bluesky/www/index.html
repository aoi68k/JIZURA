<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JIZURA bluesky-view</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="view"></canvas>

<!-- アイドル / 接続待機画面 -->
<div id="idle">
  <div class="logo">JIZURA <span class="badge">Bluesky</span></div>
  <div id="idleMsg">Bluesky タイムラインを取得中…</div>
  <div id="idleSub">60秒ごとにタイムラインを確認して文字PVとして再生します</div>
</div>

<!-- ポスト情報カード（オーバーレイ） -->
<div id="postCard" class="post-card hidden">
  <div class="avatar-wrap">
    <img id="cardAvatar" class="avatar" src="" alt="Avatar" crossorigin="anonymous">
  </div>
  <div class="post-meta">
    <div class="author-row">
      <span id="cardName" class="author-name">—</span>
      <span id="cardHandle" class="author-handle">—</span>
      <span class="bsky-icon" title="Bluesky">🦋</span>
    </div>
    <div id="cardText" class="post-text"></div>
    <div class="post-sub">
      <span id="cardTime" class="post-time"></span>
      <span id="cardMediaBadge" class="media-badge" style="display:none;"></span>
      <a id="cardLink" class="post-link" href="#" target="_blank" rel="noopener">Bluesky で開く ↗</a>
    </div>
  </div>
</div>

<!-- 操作HUD（マウス移動で表示） -->
<div id="hud">
  <div class="track">
    <div class="author-line">
      <span id="tAuthor">—</span>
      <span id="tQueueIndex" class="queue-badge"></span>
    </div>
    <div id="tSummary" class="summary-line"></div>
  </div>
  <div id="status" class="status-line">待機中</div>
  <div class="ctrls">
    <button id="prevPost" title="前の投稿 (←)">◀ 前</button>
    <button id="playPause" title="一時停止/再生 (Space)">⏸</button>
    <button id="nextPost" title="次の投稿 (→)">次 ▶</button>
    <div class="separator"></div>
    <label>演出 <select id="style"></select></label>
    <label>比率 <select id="aspect">
      <option value="16:9">16:9</option>
      <option value="9:16">9:16</option>
      <option value="1:1">1:1</option>
      <option value="4:3">4:3</option>
      <option value="21:9">21:9</option>
    </select></label>
    <label>背景 <select id="bg">
      <option value="fx">演出あり</option>
      <option value="clear">透明</option>
    </select></label>
    <button id="reroll" title="別の演出 (R)">別の演出</button>
    <div class="separator"></div>
    <span class="timer-badge" id="nextCheckBadge" title="タイムライン確認カウントダウン">確認: 60s</span>
    <button id="refreshBtn" title="今すぐタイムラインを更新">更新 🔄</button>
    <button id="settingsBtn" title="設定を開く">設定 ⚙</button>
    <button id="fullBtn" title="全画面 (F)">全画面</button>
  </div>
</div>

<!-- 設定モーダル -->
<div id="settingsModal" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-header">
      <h2>Bluesky 設定</h2>
      <button id="closeSettings" class="close-btn">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>取得モード</label>
        <div class="radio-group">
          <label><input type="radio" name="mode" value="author" checked> 指定ユーザーの投稿（認証不要）</label>
          <label><input type="radio" name="mode" value="timeline"> 自分のタイムライン（要ログイン）</label>
        </div>
      </div>
      <div class="form-group">
        <label for="cfgIdentifier">Bluesky ハンドル名 / アカウント</label>
        <input type="text" id="cfgIdentifier" placeholder="例: alice.bsky.social または bsky.app">
        <small class="hint">公開モードではこのユーザーの投稿フィードを取得します。</small>
      </div>
      <div class="form-group" id="pwdGroup">
        <label for="cfgPassword">アプリパスワード (App Password)</label>
        <input type="password" id="cfgPassword" placeholder="xxxx-xxxx-xxxx-xxxx">
        <small class="hint">タイムライン取得時に必要です。Blueskyの「設定 > アプリパスワード」で作成できます。</small>
      </div>
      <div class="form-row">
        <div class="form-group half">
          <label for="cfgPoll">確認間隔 (秒)</label>
          <input type="number" id="cfgPoll" value="60" min="10" max="600">
          <small class="hint">初期値: 60秒に1回</small>
        </div>
        <div class="form-group half">
          <label for="cfgDuration">1投稿の表示時間 (秒)</label>
          <input type="number" id="cfgDuration" value="12" min="5" max="60">
          <small class="hint">推奨: 10〜15秒</small>
        </div>
      </div>
      <div class="form-group">
        <label for="cfgOverlay">画面内アイコン・名前表示</label>
        <select id="cfgOverlay">
          <option value="both">Canvas内 ＋ カード両方</option>
          <option value="canvas">Canvas内のみ（配信・録画向け）</option>
          <option value="card">カードのみ</option>
          <option value="none">非表示</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <span id="saveStatus" class="save-status"></span>
      <button id="cancelSettings" class="btn secondary">キャンセル</button>
      <button id="saveSettings" class="btn primary">保存して反映</button>
    </div>
  </div>
</div>

<script src="jizura.js"></script>
<script src="app.js"></script>
</body>
</html>
